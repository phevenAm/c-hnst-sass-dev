name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy create-subscription-checkout --project-ref aqgzalgrjocqatskqosp --no-verify-jwt
          supabase functions deploy stripe-webhook --project-ref aqgzalgrjocqatskqosp --no-verify-jwt
          supabase functions deploy get-all-practices --project-ref aqgzalgrjocqatskqosp
